name: Event Crawler

# 반려동물 행사 소식 수집 (설계: docs/superpowers/specs/2026-10-30-pet-event-feed-design.md)
# 매일 아침 9시(한국)에 돈다. 시험하거나 급할 때는 Actions 화면의 「Run workflow」로 바로 돌린다.
on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 한국 09:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: '서버에 보내지 않고 만든 글을 출력만 한다'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: event-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crawler
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Crawl
        env:
          CUDDLE_API_BASE: https://cmarket-api.duckdns.org/api
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLIC_DATA_SERVICE_KEY: ${{ secrets.PUBLIC_DATA_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 예약 실행은 inputs 가 비어 있어 진짜로 보낸다. 손 실행은 기본이 마른 실행이다
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m run --dry-run
          else
            python -m run
          fi
