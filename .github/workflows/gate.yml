name: Gate

# 로컬에서 손으로 돌리던 게이트를 CI 에서도 돌린다.
#
# ⚠️ **2026-08-22 까지 게이트를 자동으로 돌려 주는 것이 하나도 없었다.** 워크플로우가 셋
#    있었지만(kimi-review · server-monitor · claude-review.yml.disabled) 그 안에 tsc·lint·
#    test·build 가 한 줄도 없었다. 즉 **시험을 깨뜨린 PR 도 그대로 머지될 수 있었다.**
#
# 왜 세 잡으로 나누나 — 한 잡에서 `pnpm gate:all` 을 돌리면 순서대로 돌아서
#   ① 앞 단계가 깨지면 뒤를 아예 못 본다(웹이 깨졌는지 앱이 깨졌는지 한 번에 모른다)
#   ② 전체 시간이 셋의 합이 된다
# 나란히 돌리면 **어느 쪽이 깨졌는지 바로 보이고** 시간도 가장 느린 하나로 끝난다.
# 공개 저장소라 Actions 는 무료다.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 PR 에 새로 밀어 넣으면 앞의 실행을 취소한다. 낡은 결과를 기다릴 이유가 없다
concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 무엇이 바뀌었는지 먼저 본다. 문서만 바뀌었으면 아래 셋이 곧바로 성공으로 끝난다.
  #
  # ⚠️ **`paths-ignore` 로 잡을 아예 안 돌리면 안 된다.** develop 에 이 넷이
  #    **필수 검사**로 걸려 있어서(2026-08-25 확인: 앱·웹·커밋 메시지·shared),
  #    잡이 안 돌면 그 검사는 「없음」이 되고 **PR 이 영영 머지 대기에 걸린다.**
  #    그래서 **잡은 늘 돌리되 안에서 건너뛴다.** 검사 이름이 그대로 남아야 한다.
  #
  # 왜 만들었나 — 2026-08-24 에 올린 PR 아홉 중 **넷이 문서만** 바뀐 것이었는데
  # 넷 다 웹 `next build` 를 통째로 돌렸다. 그중 하나는 39분을 매달렸다(#1075).
  scope:
    name: 무엇이 바뀌었나
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.check.outputs.has_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 견줄 대상을 받아야 하므로 얕게 받으면 안 된다
          fetch-depth: 0
      - id: check
        # ⚠️ **변수 이름을 한국어로 짓지 마라.** GitHub Actions 의 `run` 은 **bash** 로 돌고,
        #    bash 는 한글 변수 이름을 못 쓴다 — `기준=...: command not found` 로 죽는다
        #    (zsh 는 된다. 2026-08-24 에 merge-to-main.sh 에서 한 번, 08-25 에 여기서 또 걸렸다).
        #    **이름만 영문으로. 문구는 한국어로 둬도 된다.**
        run: |
          # PR 이면 base 와 견주고, push 면 바로 앞 커밋과 견준다
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # 첫 푸시 등으로 기준이 비었으면 안전하게 「코드 있음」으로 본다
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "기준 커밋을 못 잡았다 → 안전하게 다 돌린다"
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "바뀐 파일:"; echo "$CHANGED" | sed 's/^/  /'
          # 문서가 아닌 것이 하나라도 있으면 다 돌린다
          CODE=$(echo "$CHANGED" | grep -vE '^docs/|\.md$' | grep -c . || true)
          if [ "$CODE" -gt 0 ]; then
            echo "→ 코드가 $CODE 개 바뀌었다. 게이트를 다 돌린다"
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "→ 문서만 바뀌었다. 게이트를 건너뛴다"
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

  shared:
    name: shared (vitest)
    runs-on: ubuntu-latest
    needs: scope
    steps:
      - if: needs.scope.outputs.has_code == 'false'
        run: echo "문서만 바뀌었다 — 건너뛴다"
      - uses: actions/checkout@v4
        if: needs.scope.outputs.has_code == 'true'
      - uses: ./.github/actions/setup
        if: needs.scope.outputs.has_code == 'true'
      - run: pnpm gate:shared
        if: needs.scope.outputs.has_code == 'true'

  mobile:
    name: 앱 (tsc · lint · jest)
    runs-on: ubuntu-latest
    needs: scope
    steps:
      - if: needs.scope.outputs.has_code == 'false'
        run: echo "문서만 바뀌었다 — 건너뛴다"
      - uses: actions/checkout@v4
        if: needs.scope.outputs.has_code == 'true'
      - uses: ./.github/actions/setup
        if: needs.scope.outputs.has_code == 'true'
      # ⚠️ 루트에서 돌린다. `cd mobile` 뒤에 루트 명령을 치면 실패한다 —
      #    `gate:mobile` 이 그 함정을 없애려고 만든 것이다
      - run: pnpm gate:mobile
        if: needs.scope.outputs.has_code == 'true'

  web:
    name: 웹 (tsc · lint · vitest · build)
    runs-on: ubuntu-latest
    needs: scope
    steps:
      - if: needs.scope.outputs.has_code == 'false'
        run: echo "문서만 바뀌었다 — 건너뛴다"
      - uses: actions/checkout@v4
        if: needs.scope.outputs.has_code == 'true'
      - uses: ./.github/actions/setup
        if: needs.scope.outputs.has_code == 'true'
      - run: pnpm gate
        if: needs.scope.outputs.has_code == 'true'
        env:
          # 빌드 때 서버 조회가 이 값을 쓴다. **비밀이 아니다** — `NEXT_PUBLIC_*` 은
          # 어차피 브라우저 묶음에 그대로 박히고, 이 주소는 CLAUDE.md 에도 적혀 있다.
          #
          # ⚠️ 조회가 실패해도 빌드는 안 깨진다(`lib/api/server/*.ts` 가 전부 catch 해서
          #    빈 값을 돌려준다). 그래도 진짜 주소를 줘서 **운영과 같은 길**을 밟게 한다.
          NEXT_PUBLIC_API_BASE_URL: https://cmarket-api.duckdns.org/api
          NEXT_PUBLIC_WS_URL: https://cmarket-api.duckdns.org/ws-stomp
          # ⚠️ NEXT_PUBLIC_NAVER_MAP_CLIENT_ID 는 **일부러 안 준다.** 지도 조각이
          #    브라우저에서 읽는 값이라 빌드에는 필요 없다(`MapContainer.tsx`).

  commitlint:
    name: 커밋 메시지
    runs-on: ubuntu-latest
    # 푸시에서는 안 본다 — 이미 들어간 옛 커밋까지 다시 걸고 넘어지지 않게
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # 이 PR 이 더한 커밋을 다 봐야 하므로 얕게 받으면 안 된다
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # 로컬 훅(.husky/commit-msg)이 이미 보지만, `--no-verify` 로 건너뛸 수 있어
      # 여기서 다시 본다
      - run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
