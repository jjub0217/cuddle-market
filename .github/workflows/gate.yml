name: Gate

# 로컬에서 손으로 돌리던 게이트를 CI 에서도 돌린다.
#
# ⚠️ **2026-08-22 까지 게이트를 자동으로 돌려 주는 것이 하나도 없었다.** 워크플로우가 셋
#    있었지만(kimi-review · server-monitor · claude-review.yml.disabled) 그 안에 tsc·lint·
#    test·build 가 한 줄도 없었다. 즉 **시험을 깨뜨린 PR 도 그대로 머지될 수 있었다.**
#
# 왜 세 잡으로 나누나 — 한 잡에서 `pnpm gate:all` 을 돌리면 순서대로 돌아서
#   ① 앞 단계가 깨지면 뒤를 아예 못 본다(웹이 깨졌는지 앱이 깨졌는지 한 번에 모른다)
#   ② 전체 시간이 셋의 합이 된다
# 나란히 돌리면 **어느 쪽이 깨졌는지 바로 보이고** 시간도 가장 느린 하나로 끝난다.
# 공개 저장소라 Actions 는 무료다.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 PR 에 새로 밀어 넣으면 앞의 실행을 취소한다. 낡은 결과를 기다릴 이유가 없다
concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: shared (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm gate:shared

  mobile:
    name: 앱 (tsc · lint · jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # ⚠️ 루트에서 돌린다. `cd mobile` 뒤에 루트 명령을 치면 실패한다 —
      #    `gate:mobile` 이 그 함정을 없애려고 만든 것이다
      - run: pnpm gate:mobile

  web:
    name: 웹 (tsc · lint · vitest · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm gate
        env:
          # 빌드 때 서버 조회가 이 값을 쓴다. **비밀이 아니다** — `NEXT_PUBLIC_*` 은
          # 어차피 브라우저 묶음에 그대로 박히고, 이 주소는 CLAUDE.md 에도 적혀 있다.
          #
          # ⚠️ 조회가 실패해도 빌드는 안 깨진다(`lib/api/server/*.ts` 가 전부 catch 해서
          #    빈 값을 돌려준다). 그래도 진짜 주소를 줘서 **운영과 같은 길**을 밟게 한다.
          NEXT_PUBLIC_API_BASE_URL: https://cmarket-api.duckdns.org/api
          NEXT_PUBLIC_WS_URL: https://cmarket-api.duckdns.org/ws-stomp
          # ⚠️ NEXT_PUBLIC_NAVER_MAP_CLIENT_ID 는 **일부러 안 준다.** 지도 조각이
          #    브라우저에서 읽는 값이라 빌드에는 필요 없다(`MapContainer.tsx`).

  commitlint:
    name: 커밋 메시지
    runs-on: ubuntu-latest
    # 푸시에서는 안 본다 — 이미 들어간 옛 커밋까지 다시 걸고 넘어지지 않게
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # 이 PR 이 더한 커밋을 다 봐야 하므로 얕게 받으면 안 된다
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # 로컬 훅(.husky/commit-msg)이 이미 보지만, `--no-verify` 로 건너뛸 수 있어
      # 여기서 다시 본다
      - run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
