name: 준비
description: pnpm · Node 를 깔고 의존성을 받는다 (게이트 잡 넷이 같이 쓴다)

runs:
  using: composite
  steps:
    # ⚠️ pnpm 을 **Node 보다 먼저** 깐다. setup-node 의 `cache: pnpm` 이 pnpm 을 찾기 때문이다.
    #    순서를 바꾸면 「Unable to locate executable file: pnpm」 으로 죽는다
    - uses: pnpm/action-setup@v4
      with:
        version: 11

    - uses: actions/setup-node@v4
      with:
        # 개발자 맥과 같은 큰 판(22.x). server-monitor.yml 은 24 를 쓰는데 그건
        # 의존성 없이 스크립트 하나만 돌리는 것이라 상관없다
        node-version: 22
        cache: pnpm

    # ⚠️ `--frozen-lockfile` 이라 **lock 파일과 package.json 이 어긋나면 여기서 죽는다.**
    #    그게 맞다 — 아무도 모르게 판이 바뀌는 것을 막는다
    - run: pnpm install --frozen-lockfile
      shell: bash
